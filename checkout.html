<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - TheDealMentor.AI</title>

<script>document.documentElement.classList.add('js');var __dmTheme=localStorage.getItem('dm-theme');if(__dmTheme==='light')document.documentElement.setAttribute('data-theme','light');</script>
<style>
.checkout-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:2}
.checkout-card{background:var(--bg-card);border:1px solid var(--card-bd);border-radius:var(--radius-lg);padding:48px 40px;box-shadow:var(--shadow);backdrop-filter:blur(10px);max-width:460px;text-align:center}
.checkout-logo{font-family:'Mulish',ui-sans-serif,sans-serif;font-weight:700;font-size:32px;color:var(--ink);letter-spacing:-.025em;margin-bottom:32px}
.checkout-logo b{background:linear-gradient(110deg,var(--chr-1),var(--chr-2),var(--chr-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.spinner{width:42px;height:42px;border:3px solid var(--card-bd);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
.checkout-card h1{font-family:'Mulish',ui-sans-serif,sans-serif;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:12px}
.checkout-card p{font-family:'Mulish',sans-serif;font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.checkout-tiny{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:32px}
#error{display:none}
#error a.btn-primary{margin-top:20px}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="checkout-shell">
  <div class="checkout-card">
    <div class="checkout-logo">Deal<b>Mentor</b></div>

    <div id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Opening secure checkout…</h1>
      <p>Powered by Paddle. If the checkout does not appear, check that pop-ups are allowed.</p>
    </div>

    <div id="error">
      <h1>No plan selected</h1>
      <p>We could not find a plan to check out. Head back to pricing and choose your plan.</p>
      <a class="btn-primary btn-lg" href="https://www.thedealmentor.ai/pricing">View Pricing</a>
    </div>

    <div class="checkout-tiny">TheDealMentor.AI · by KSW Solutions · Secure payment by Paddle</div>
  </div>
</div>

<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
(function () {
  var PADDLE_TOKEN = "live_4b4932cc52e772d6e6c4e2c637c";
  var SUCCESS_URL  = "https://app.thedealmentor.ai/dashboard?upgraded=true";
  var params  = new URLSearchParams(window.location.search);
  var priceId = params.get("price");
  var ptxn    = params.get("_ptxn");
  var email   = params.get("email");
  function showError(){document.getElementById("loading").style.display="none";document.getElementById("error").style.display="block"}
  try {
    Paddle.Environment.set("production");
    Paddle.Initialize({
      token: PADDLE_TOKEN,
      eventCallback: function (data) {
        if (data && data.name === "checkout.closed") {
          window.location.href = "https://www.thedealmentor.ai/pricing";
        }
      }
    });
    if (ptxn) { /* Paddle handles auto-open */ }
    else if (priceId) {
      var co = { items:[{priceId:priceId,quantity:1}], settings:{displayMode:"overlay",theme:"dark",successUrl:SUCCESS_URL} };
      if (email) { co.customer = { email: email }; }
      Paddle.Checkout.open(co);
    } else { showError(); }
  } catch (e) { console.error("Checkout error:", e); showError(); }
})();
</script>
